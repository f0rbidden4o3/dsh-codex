name: Fork GitHub Release

on:
  push:
    tags:
      - 'fork-v*'

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'f0rbidden4o3/dsh-codex'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "fork-v$version"
      - run: pnpm --config.minimum-release-age=0 install --frozen-lockfile
      - run: pnpm run check
      - name: Pack artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          pnpm pack --pack-destination artifacts
          cd artifacts
          sha256sum *.tgz > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --generate-notes --prerelease
